version: '3.8'\n\nservices:\n  db:\n    image: postgres:15-alpine\n    environment:\n      POSTGRES_USER: future_codec_user\n      POSTGRES_PASSWORD: future_codec_password\n      POSTGRES_DB: future_codec_db\n    volumes:\n      - db_data:/var/lib/postgresql/data\n    ports:\n      - '5432:5432'\n    healthcheck:\n      test: [ 'CMD-SHELL', 'pg_isready -U future_codec_user' ]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  redis:\n    image: redis:7-alpine\n    ports:\n      - '6379:6379'\n    healthcheck:\n      test: [ 'CMD', 'redis-cli', 'ping' ]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\nvolumes:\n  db_data: {}